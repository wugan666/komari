name: Build pinned owned frontend
description: Build the owned frontend from one reviewed commit using its committed lockfile.

runs:
  using: composite
  steps:
    - name: Check out the reviewed owned frontend
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: wugan666/komari-web
        ref: "3e99470d1983333398c6a6a974fc611301b49406"
        path: .frontend-source
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22.23.2"
        cache: ""
    - name: Build frontend from the locked dependency graph
      shell: bash
      run: |
        set -euo pipefail
        (
          cd .frontend-source
          npm ci --no-audit --no-fund
          timeout --signal=TERM --kill-after=5s 60s npm run test:owned
          timeout --signal=TERM --kill-after=5s 60s npm run test:onboarding
          timeout --signal=TERM --kill-after=5s 60s npm run test:network
          timeout --signal=TERM --kill-after=5s 60s npm run test:security
          npm run build
        )
        test -f .frontend-source/dist/index.html
        if ! command -v zstd >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y zstd
        fi
        mkdir -p web/public/defaultTheme
        tar -cf "$RUNNER_TEMP/komari-default-dist.tar" -C .frontend-source/dist .
        zstd -19 -T0 -q "$RUNNER_TEMP/komari-default-dist.tar" -o web/public/defaultTheme/dist.tar.zst
        cp .frontend-source/komari-theme.json web/public/defaultTheme/
        for preview in preview.png perview.png; do
          if [ -f ".frontend-source/$preview" ]; then
            cp ".frontend-source/$preview" "web/public/defaultTheme/$preview"
          fi
        done
        if [ -f web/public/defaultTheme/preview.png ] && [ ! -f web/public/defaultTheme/perview.png ]; then
          cp web/public/defaultTheme/preview.png web/public/defaultTheme/perview.png
        fi
        if [ -f web/public/defaultTheme/perview.png ] && [ ! -f web/public/defaultTheme/preview.png ]; then
          cp web/public/defaultTheme/perview.png web/public/defaultTheme/preview.png
        fi
        git -C .frontend-source rev-parse HEAD > web/public/defaultTheme/source-commit.txt
        tar -czf "$RUNNER_TEMP/komari-frontend.tar.gz" -C web/public/defaultTheme .
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: komari-frontend
        path: ${{ runner.temp }}/komari-frontend.tar.gz
        if-no-files-found: error
        retention-days: 14
