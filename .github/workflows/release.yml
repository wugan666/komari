name: Publish Owned Stable Server

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New stable version, for example 1.5.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: owned-server-stable
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'wugan666/komari' && github.ref == 'refs/heads/owned'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      channel: stable
      version: ${{ inputs.version }}
